name: Build firmware and deploy wizard

on:
  push:
    branches: [main]
    paths:
      - 'wizard/**'
      - 'firmware/**'
      - 'config/adopt/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned deliberately, matching `min_version` in config/adopt/proxy-core.yaml
  # and the version the fleet runs. Bump both together — and re-sync the
  # bluetooth_proxy fork when you do (docs/upgrading.md).
  ESPHOME_VERSION: "2026.9.0"

jobs:
  # Every board is compiled on every deploy. The deploy job publishes the whole
  # site in one shot, so a partial build would silently drop firmware that is
  # already live — there is no incremental publish to fall back on.
  build:
    name: ${{ matrix.slug }} ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # board x variant. The wizard asks two questions that cannot be answered
        # after the fact because both are compile-time, so every combination is
        # built ahead of time:
        #   standard / noapple   - is the Apple manufacturer blocklist on
        #   -adv suffix          - advertisements only, no connection relaying
        slug:
          - esp32
          - esp32c3
          - esp32c5
          - esp32c6
          - esp32s3
          - esp32s3-eth-waveshare
          - esp32s3-eth-xiao
        variant:
          - standard
          - standard-adv
          - noapple
          - noapple-adv
    steps:
      - uses: actions/checkout@v4

      - name: Compose config
        run: firmware/compose.sh ${{ matrix.slug }} ${{ matrix.variant }} > firmware/_build.yaml

      - name: Build
        id: build
        # v8.x, not v7: v7 carried a hardcoded chip-family map that stopped at
        # the C6, so the ESP32-C5 compiled fine and then failed at manifest
        # generation with "Unsupported chip family: ESP32C5". v8 reads
        # ESPHome's own VARIANT_FRIENDLY map instead, which knows the C5.
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: firmware/_build.yaml
          version: ${{ env.ESPHOME_VERSION }}
          # ESP Web Tools needs the full manifest (chipFamily, parts, offsets),
          # not the partial one intended for release aggregation.
          complete-manifest: true
          release-summary: >-
            Filtering BLE proxy for Home Assistant. Wi-Fi is set up over Improv
            from the browser; RSSI threshold and scan profile are tunable from
            Home Assistant without reflashing.
          release-url: https://github.com/davidcoulson/esphome-ble-proxy

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.slug }}--${{ matrix.variant }}
          # The action writes into a folder named after the device plus its
          # chip variant, which it reports as the `name` output.
          path: ${{ steps.build.outputs.name }}
          if-no-files-found: error

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: artifacts

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r wizard/. site/
          # artifacts/fw-<board>--<variant>/... -> site/firmware/<board>/<variant>/...
          # manifest.json references its binaries by bare filename, so the
          # manifest and the .bin must stay in the same directory.
          for dir in artifacts/fw-*; do
            pair="${dir#artifacts/fw-}"
            board="${pair%%--*}"
            variant="${pair#*--}"
            mkdir -p "site/firmware/$board/$variant"
            cp -r "$dir"/. "site/firmware/$board/$variant/"
            # The .elf is debug symbols — useful for decoding a backtrace, but
            # several MB per build and nothing the flasher reads.
            rm -f site/firmware/$board/$variant/*.elf
            test -f "site/firmware/$board/$variant/manifest.json" \
              || { echo "::error::no manifest.json for $board/$variant"; exit 1; }
          done
          echo "--- published firmware ---"
          find site/firmware -type f | sort
          du -sh site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
