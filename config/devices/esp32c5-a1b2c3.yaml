# ESP32-C5 proxy. No family package: only a handful of these exist and each
# carries its own WS2812 status LED wiring, so the composition lives here.
#
# The C5 is the only board here with a 5 GHz radio. Putting WiFi on 5 GHz takes
# it off the band BLE scans, which removes the radio contention that forces
# every other WiFi proxy down to the Balanced 37.5% duty cycle. A C5 on 5 GHz
# can run Aggressive.
substitutions:
  mac: a1b2c3
  area: "Master Bedroom"

packages:
  gwwd: !include ../common/gateway-watchdog.yaml
  common: !include ../common/djc-common.yaml
  platform: !include ../common/esp32-ble-platform.yaml
  ble: !include ../common/ble-proxy.yaml
  wifi: !include ../common/wifi.yaml
  debug: !include ../common/debug-lite.yaml

esphome:
  name: "esp32c5-${mac}"
  friendly_name: "${area} esp32c5 ${mac}"
  name_add_mac_suffix: false
  project:
    name: "dcoulson.ble-esp32c5"
    version: "2026.09.17.0+ble${ble_proxy_version}"

esp32:
  variant: esp32c5
  flash_size: 4MB
  cpu_frequency: 240MHZ
  framework:
    sdkconfig_options:
      # CONFIG_SOC_RMT_SUPPORTED is deliberately NOT disabled here (unlike
      # rrn00/s2224): this board drives its status LED via esp32_rmt_led_strip,
      # which needs the RMT peripheral.
      # Coexistence stays ENABLED: this node runs a BLE proxy, so the coex
      # scheduler is genuinely arbitrating WiFi against BLE rather than idling.
      CONFIG_ESP_COEX_SW_COEXIST_ENABLE: y

wifi:
  band_mode: 5GHZ

light:
  - platform: status_led
    name: "status led"
    output: statusoutput
  - platform: esp32_rmt_led_strip
    channel_colors: RGB
    chipset: WS2812
    pin: GPIO27
    num_leds: 1
    name: "Status LED RGB"
    id: statusledlight
    icon: "mdi:led-outline"

output:
  - platform: template
    id: statusoutput
    type: binary
    write_action:
      - if:
          condition:
            lambda: return state > 0;
          then:
            - light.turn_on:
                id: statusledlight
                red: 1.0
                green: 0.0
                blue: 0.0
                brightness: 50%
          else:
            - light.turn_on:
                id: statusledlight
                green: 1.0
                red: 1.0
                blue: 1.0
                brightness: 20%
