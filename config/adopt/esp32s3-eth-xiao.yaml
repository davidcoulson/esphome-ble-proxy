# Adoption package for esp32s3-eth-xiao (XIAO ESP32-S3 + W5500 (no reset line)).
#
# Ethernet: no WiFi, so no Improv provisioning is needed — it gets an address by
# DHCP the moment you plug it in. Best proxy hardware there is: no radio
# contention, so it runs the Aggressive scan profile rather than Balanced.
#
# Once adopted, add your irks: / mac_allowlist: here — see docs/filtering.md.

packages:
  proxy: !include proxy-core.yaml

esp32:
  variant: esp32s3
  flash_size: 4MB
  watchdog_timeout: 10s
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: y

# No WiFi on this board, so remove what proxy-core.yaml set up for it.
wifi: !remove
captive_portal: !remove
improv_serial: !remove

ethernet:
  type: W5500
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8
  cs_pin: GPIO2
  interrupt_pin: GPIO10
  clock_speed: 25MHz

esp32_ble:
  max_connections: 5

bluetooth_proxy:
  connection_slots: 5

api:
  # 300s ON PURPOSE (proxy-core.yaml defaults to 0s). This is an Ethernet node:
  # no wifi reboot_timeout and no gateway watchdog, so the API timeout is its
  # only automatic recovery from "link up but unreachable".
  reboot_timeout: 300s

select:
  - id: !extend sel_ble_scan_profile
    # No shared radio here, so there is no reason to throttle scanning.
    initial_option: "Aggressive"

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP"
      entity_category: diagnostic
