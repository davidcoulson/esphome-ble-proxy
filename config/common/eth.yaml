
ethernet:
  type: W5500
  mosi_pin: GPIO11
  miso_pin: GPIO12
  clk_pin: GPIO13
  cs_pin: GPIO14
  reset_pin: GPIO9
  interrupt_pin: GPIO10
  clock_speed: 25MHz

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP"
      entity_category: diagnostic
    mac_address:
      name: ESP MAC Address
      entity_category: diagnostic