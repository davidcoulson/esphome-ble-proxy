# ---------------------------------------------------------------------------
# Shared ESP32 (C3 / C5 / C6) platform tuning for the BLE-proxy families:
# rrn00, s2224-esp32c3, cf-sw1-esp8685 and the esp32c5-* device files.
#
# Counterpart of esp32c3-light-platform.yaml. Those four files used to carry
# their own identical copy of this block; now a knob is re-reasoned about once
# and the copies cannot drift. Deliberately variant-agnostic: the family sets
# esp32.variant / flash_size / cpu_frequency, this file only tunes the
# framework. Dict-merges with djc-common.yaml's esp32: block (IDF version,
# watchdog) on disjoint keys, so package order does not matter.
#
# NOT here, on purpose: the CONFIG_ESP_COEX_* lines. Coexistence stays ON for
# these nodes (BLE is a real second radio user), but rrn00/s2224 add
# PREFER_WIFI and cf-sw1/esp32c5 do not, so each family keeps its own pair.
#
# REMOVED on 2026-09-16 while consolidating, and why:
#   CONFIG_BT_HFP_ENABLE / CONFIG_BT_HID_ENABLED / CONFIG_BT_HID_HOST_ENABLED
#     Classic-Bluetooth Kconfig symbols. They depend on BT_CLASSIC_ENABLED,
#     which only exists on the original ESP32; on the BLE-only C3/C5/C6 the
#     symbols are undefined and the assignments were ignored.
#   The four ESPHome-default lines and the two first-class keys listed in
#     the `advanced:` comment below.
# ---------------------------------------------------------------------------

esp32:
  framework:
    advanced:
      compiler_optimization: PERF
      # Formerly raw sdkconfig_options; ESPHome 2026.9 has first-class keys:
      #   CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT: y -> assertion_level
      #   CONFIG_LWIP_DNS_SUPPORT_MDNS_QUERIES: n       -> enable_lwip_mdns_queries
      # And these are now ESPHome defaults, so they were dropped outright:
      #   CONFIG_ESP_DEBUG_OCDAWARE: n, CONFIG_VFS_SUPPORT_SELECT: n,
      #   CONFIG_LWIP_DHCPS: n (no AP), CONFIG_ESP_WIFI_SOFTAP_SUPPORT: n (no AP).
      assertion_level: SILENT
      enable_lwip_mdns_queries: false
    sdkconfig_options:
      CONFIG_BT_STACK_NO_LOG: y
      CONFIG_COMPILER_SAVE_RESTORE_LIBCALLS: y
      CONFIG_ESP_PROTOCOMM_SUPPORT_SECURITY_VERSION_1: n
      CONFIG_ESP_PROTOCOMM_SUPPORT_SECURITY_VERSION_2: n
      CONFIG_ESP_SYSTEM_BBPLL_RECALIB: y
      CONFIG_ESP_SYSTEM_HW_PC_RECORD: n
      CONFIG_ESP_SYSTEM_NO_BACKTRACE: y
      CONFIG_ESP_SYSTEM_PANIC_SILENT_REBOOT: y
      CONFIG_ESP_WIFI_IRAM_OPT: y
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_ENABLE_WPA3_OWE_STA: n
      CONFIG_ESP_WIFI_ENABLE_WPA3_SAE: n
      CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT: n
      CONFIG_ESP_WIFI_RX_BA_WIN: "6"
      CONFIG_ESP_WIFI_RX_IRAM_OPT: y
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "10"
      CONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_0: y
      CONFIG_ETH_USE_SPI_ETHERNET: n
      CONFIG_HAL_ASSERTION_SILENT: y
      CONFIG_HAL_LOG_LEVEL_NONE: y
      CONFIG_HAL_SYSTIMER_USE_ROM_IMPL: y
      CONFIG_HAL_WDT_USE_ROM_IMPL: y
      CONFIG_HEAP_PLACE_FUNCTION_INTO_FLASH: y
      CONFIG_HEAP_TLSF_USE_ROM_IMPL: y
      CONFIG_LOG_DEFAULT_LEVEL_NONE: y
      CONFIG_LOG_DYNAMIC_LEVEL_CONTROL: n
      CONFIG_LOG_TAG_LEVEL_IMPL_NONE: y
      CONFIG_LOG_TIMESTAMP_SUPPORT: n
      CONFIG_LOG_VERSION_2: y
      CONFIG_LWIP_IPV6: n
      CONFIG_LWIP_IPV6_AUTOCONFIG: n
      CONFIG_LWIP_ND6: n
      CONFIG_LWIP_TCP_HIGH_SPEED_RETRANSMISSION: y
      CONFIG_LWIP_TCP_MAXRTX: "12"
      CONFIG_LWIP_MAX_RAW_PCBS: "4"
      CONFIG_NEWLIB_NANO_FORMAT: y
      CONFIG_SPI_FLASH_ROM_DRIVER_PATCH: n
      CONFIG_SPI_FLASH_ROM_IMPL: y
      CONFIG_SPI_MASTER_ISR_IN_IRAM: n
      CONFIG_SPI_SLAVE_ISR_IN_IRAM: n
