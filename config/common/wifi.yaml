wifi:
  min_auth_mode: WPA2
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  reboot_timeout: 5min
  enable_btm: true
  enable_rrm: true
  output_power: 17dB


text_sensor:
  # MAC and BSSID are marked internal: they stay available to on-device
  # lambdas and the local web UI, but are dropped from the API, so they
  # cost no entity registry slot and no recorder writes. The MAC is fixed
  # for the life of the device and already encoded in every node name;
  # the BSSID only matters while actively chasing a roaming problem -
  # comment the flag out temporarily if you need it visible in HA.
  # NOTE: this file is shared by ~16 configs, so this applies fleet-wide.
  - platform: wifi_info
    ip_address:
      name: "IP"
      icon: mdi:ip
      entity_category: diagnostic
    mac_address:
      name: "MAC"
      icon: mdi:ethernet
      entity_category: diagnostic
      internal: true
    ssid:
      name: "SSID"
      icon: mdi:access-point-network
      entity_category: diagnostic
    bssid:
      name: "BSSID"
      icon: mdi:wifi-marker
      entity_category: diagnostic
      internal: true

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    internal: true
    id: wifi_signal_db
    icon: mdi:wifi
    entity_category: "diagnostic"
    filters:
      - sliding_window_moving_average:
          window_size: 60
          send_every: 60

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    id: wifi_signal_pct
    name: "WiFi Signal"
    icon: mdi:wifi
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
