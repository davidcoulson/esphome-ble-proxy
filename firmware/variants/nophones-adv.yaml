# Variant: no-phones, advertisements only.
# Blocks Apple. Home Assistant cannot connect to BLE devices through it.
#
# For proxies that exist to reach sensors and tags (BTHome, Xiaomi, SwitchBot,
# Tile, thermometers) rather than to track people. Apple manufacturer data is
# ~69% of what a proxy hears in a normal house and none of it is useful here.
#
# >> THIS WILL STOP HOME ASSISTANT SEEING YOUR IPHONES AND APPLE WATCHES. <<
# They advertise Apple manufacturer data, and with no IRKs configured nothing
# marks them protected. That is the deliberate trade: pick a standard variant
# if you track phones over Bluetooth.
bluetooth_proxy:
  # active: false — forwards advertisements but will not relay connections.
  # Home Assistant cannot reach a lock, an LED strip or a SwitchBot through this
  # proxy, and it holds no connection slots. Costs less RAM, and the radio is
  # never taken away from scanning by a connection.
  #
  # Pick a connecting variant unless every BLE device you care about is a pure
  # broadcaster.
  active: false
  manufacturer_blocklist:
    - 0x004C  # Apple
  # HomeKit accessories advertise under Apple's company id with subtype 0x06,
  # so the blocklist would silently kill every one — and unlike phones they
  # have no IRK to rescue them.
  allow_homekit: true
  # AirTags and licensed third-party tags: Apple company id, subtype 0x12. No
  # per-accessory scoping exists, so every FindMy tag in range comes through;
  # -85 keeps a neighbour's AirTag at the fence out of it.
  allow_findmy:
    rssi: -85
